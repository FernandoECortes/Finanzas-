<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <div class="max-w-md mx-auto p-4 pb-24">
        <!-- Cabecera -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold">Control de Gastos</h1>
                <p class="text-xs text-slate-400">Finanzas personales</p>
            </div>
            <button onclick="abrirModalMovimiento()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2 rounded-xl shadow-lg transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Nuevo
            </button>
        </header>

        <!-- Filtros Temporales (Semana, Mes, Año) -->
        <div class="bg-slate-800 p-1.5 rounded-2xl flex justify-between mb-4 border border-slate-700">
            <button onclick="cambiarFiltroTemporal('semana')" id="btn-semana" class="flex-1 py-1.5 text-xs font-semibold rounded-xl transition text-slate-400">Semana</button>
            <button onclick="cambiarFiltroTemporal('mes')" id="btn-mes" class="flex-1 py-1.5 text-xs font-semibold rounded-xl transition bg-emerald-500 text-slate-950 shadow">Mes</button>
            <button onclick="cambiarFiltroTemporal('anio')" id="btn-anio" class="flex-1 py-1.5 text-xs font-semibold rounded-xl transition text-slate-400">Año</button>
        </div>

        <!-- Tarjeta de Resumen del Periodo -->
        <div class="bg-gradient-to-br from-slate-800 to-slate-800/80 p-5 rounded-3xl border border-slate-700 mb-6 shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span id="label-periodo-actual" class="text-xs font-medium uppercase tracking-wider text-emerald-400">Septiembre 2026</span>
                <div class="flex gap-1">
                    <button onclick="navegarPeriodo(-1)" class="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-xs"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="navegarPeriodo(1)" class="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-xs"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="text-3xl font-extrabold mb-4" id="total-periodo">$0.00</div>
            
            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-700/60">
                <div>
                    <span class="text-[10px] text-slate-400 uppercase tracking-wide">Ingresos</span>
                    <p class="text-sm font-bold text-emerald-400" id="ingresos-periodo">$0.00</p>
                </div>
                <div>
                    <span class="text-[10px] text-slate-400 uppercase tracking-wide">Gastos</span>
                    <p class="text-sm font-bold text-rose-400" id="gastos-periodo">$0.00</p>
                </div>
            </div>
        </div>

        <!-- Vista de Calendario / Selector de Días -->
        <div class="bg-slate-800/60 rounded-2xl p-4 border border-slate-700 mb-6">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-slate-300"><i class="fa-regular fa-calendar mr-1.5"></i> Calendario de Actividad</h3>
                <span id="filtro-fecha-activo" class="text-xs text-emerald-400 cursor-pointer hover:underline" onclick="limpiarFiltroFecha()">Ver todo</span>
            </div>
            <!-- Cuadrícula del Calendario mensual -->
            <div class="grid grid-cols-7 gap-1 text-center text-xs mb-2 text-slate-400 font-semibold">
                <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sa</span><span>Do</span>
            </div>
            <div id="grid-calendario" class="grid grid-cols-7 gap-1 text-center text-xs">
                <!-- Se llena dinámicamente con JS -->
            </div>
        </div>

        <!-- Lista de Movimientos -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-slate-300">Movimientos</h3>
                <span id="contador-movimientos" class="text-xs text-slate-400">0 registros</span>
            </div>
            <div id="lista-movimientos" class="space-y-2.5">
                <!-- Los movimientos se inyectan aquí -->
            </div>
        </div>
    </div>

    <!-- Modal para Agregar / Editar Movimiento -->
    <div id="modal-movimiento" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl border border-slate-700 p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="titulo-modal" class="text-lg font-bold">Nuevo Movimiento</h3>
                <button onclick="cerrarModalMovimiento()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="form-movimiento" onsubmit="guardarMovimiento(event)" class="space-y-4">
                <input type="hidden" id="movimiento-id">
                
                <!-- Tipo (Gasto / Ingreso) -->
                <div class="grid grid-cols-2 gap-2 bg-slate-800 p-1 rounded-xl">
                    <button type="button" id="tipo-gasto" onclick="setTipo('gasto')" class="py-2 rounded-lg text-xs font-bold transition bg-rose-500 text-white">Gasto</button>
                    <button type="button" id="tipo-ingreso" onclick="setTipo('ingreso')" class="py-2 rounded-lg text-xs font-bold transition text-slate-400">Ingreso</button>
                </div>

                <!-- Monto -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Monto ($)</label>
                    <input type="number" step="0.01" id="monto" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-lg font-bold focus:outline-none focus:border-emerald-500" placeholder="0.00">
                </div>

                <!-- Categoría y Subcategoría -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Categoría</label>
                        <select id="categoria" onchange="actualizarSubcategorias()" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                            <option value="Alimentación">Alimentación</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Vivienda">Vivienda</option>
                            <option value="Ocio">Ocio</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Subcategoría</label>
                        <select id="subcategoria" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                            <!-- Dinámico -->
                        </select>
                    </div>
                </div>

                <!-- Fecha y Hora -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Fecha y Hora</label>
                    <input type="datetime-local" id="fecha-hora" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>

                <!-- Nota -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nota (Opcional)</label>
                    <input type="text" id="nota" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500" placeholder="Ej. Compra en almacén">
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg mt-2">Guardar Movimiento</button>
            </form>
        </div>
    </div>

    <!-- Modal de Detalle Completo del Movimiento -->
    <div id="modal-detalle" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 w-full max-w-sm rounded-3xl border border-slate-700 p-6 shadow-2xl relative">
            <button onclick="cerrarModalDetalle()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            
            <div class="text-center mb-5 pt-2">
                <span id="det-tipo-badge" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Gasto</span>
                <div id="det-monto" class="text-3xl font-extrabold mt-2">$0.00</div>
            </div>

            <div class="space-y-3 bg-slate-800/50 p-4 rounded-2xl border border-slate-700/60 mb-5 text-sm">
                <div class="flex justify-between">
                    <span class="text-slate-400">Categoría:</span>
                    <span id="det-categoria" class="font-semibold">Alimentación</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">Subcategoría:</span>
                    <span id="det-subcategoria" class="font-semibold text-emerald-400">Supermercado</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">Fecha y Hora:</span>
                    <span id="det-fecha" class="font-medium">06/09/2026, 19:42</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-400">Nota:</span>
                    <span id="det-nota" class="font-medium text-slate-300">-</span>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="editarMovimientoDesdeDetalle()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-pen text-xs"></i> Editar
                </button>
                <button onclick="eliminarMovimientoActual()" class="flex-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-semibold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-trash text-xs"></i> Eliminar
                </button>
            </div>
        </div>
    </div>
