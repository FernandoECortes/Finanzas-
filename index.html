<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoFinanzas 🏍️</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between pb-20">

    <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-base font-bold text-amber-400">MotoFinanzas 🏍️</h1>
        <span class="text-xs bg-slate-800 px-2.5 py-1 rounded-full text-slate-300 border border-slate-700">Córdoba</span>
    </header>

    <main class="p-4 flex-1 max-w-md mx-auto w-full">
        
        <section id="view-home" class="space-y-4">
            <div class="bg-gradient-to-br from-amber-500 to-amber-700 p-5 rounded-2xl shadow-lg text-slate-950">
                <p class="text-xs font-semibold uppercase tracking-wider opacity-80">Recaudado Hoy</p>
                <h2 id="total-hoy" class="text-3xl font-extrabold mt-1">$0</h2>
                <div class="mt-4 pt-3 border-t border-amber-600/40 flex justify-between text-xs font-medium">
                    <span>Compromisos pendientes:</span>
                    <span id="total-pendientes" class="font-bold">$0</span>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wide">Últimos Registros</h3>
                <div id="lista-ingresos" class="space-y-2">
                    </div>
            </div>
        </section>

        <section id="view-add" class="space-y-4 hidden">
            <h2 class="text-lg font-bold text-white">Cargar Ingreso Rápido</h2>
            <form id="form-ingreso" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Monto en Pesos ($)</label>
                    <input 
                        type="number" 
                        id="input-monto" 
                        placeholder="Ej: 15000"
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-white text-lg focus:outline-none focus:border-amber-400"
                        required
                    >
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Origen</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="setOrigen('Uber Moto')" id="btn-uber" class="origen-btn p-3 rounded-xl text-xs font-semibold border bg-amber-400 text-slate-950 border-amber-400">Uber Moto</button>
                        <button type="button" onclick="setOrigen('Efectivo / Particular')" id="btn-part" class="origen-btn p-3 rounded-xl text-xs font-semibold border bg-slate-900 text-slate-300 border-slate-800">Particular</button>
                    </div>
                </div>

                <button type="submit" class="w-full bg-amber-400 text-slate-950 font-bold p-3 rounded-xl mt-4 cursor-pointer">
                    Guardar Ingreso
                </button>
            </form>
        </section>

        <section id="view-compromisos" class="space-y-4 hidden">
            <h2 class="text-lg font-bold text-white">Compromisos de Pago</h2>
            <div id="lista-compromisos" class="space-y-2">
                </div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900 border-t border-slate-800 flex justify-around p-3 z-50">
        <button onclick="cambiarVista('home')" id="nav-home" class="text-xs font-medium text-amber-400">🏠 Inicio</button>
        <button onclick="cambiarVista('add')" id="nav-add" class="bg-amber-400 text-slate-950 px-5 py-1.5 rounded-full font-bold text-sm shadow-md">➕ Cargar</button>
        <button onclick="cambiarVista('compromisos')" id="nav-compromisos" class="text-xs font-medium text-slate-400">📅 Pagos</button>
    </nav>

    <script>
        let origenSeleccionado = 'Uber Moto';
        
        // Datos de ejemplo (guardados en la memoria del celu con localStorage)
        let ingresos = JSON.parse(localStorage.getItem('moto_ingresos')) || [
            { id: 1, monto: 18500, origen: 'Uber Moto', fecha: 'Hoy' }
        ];
        
        let compromisos = JSON.parse(localStorage.getItem('moto_compromisos')) || [
            { id: 1, nombre: 'Seguro Moto', monto: 25000, categoria: 'Movilidad', vto: '10/09', pagado: false },
            { id: 2, nombre: 'Alquiler', monto: 180000, categoria: 'Esencial', vto: '15/09', pagado: false }
        ];

        function cambiarVista(vista) {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-add').classList.add('hidden');
            document.getElementById('view-compromisos').classList.add('hidden');
            
            document.getElementById('nav-home').className = "text-xs font-medium text-slate-400";
            document.getElementById('nav-compromisos').className = "text-xs font-medium text-slate-400";

            document.getElementById('view-' + vista).classList.remove('hidden');
            if(vista !== 'add') {
                document.getElementById('nav-' + vista).className = "text-xs font-medium text-amber-400";
            }
            actualizarUI();
        }

        function setOrigen(origen) {
            origenSeleccionado = origen;
            if(origen === 'Uber Moto') {
                document.getElementById('btn-uber').className = "origen-btn p-3 rounded-xl text-xs font-semibold border bg-amber-400 text-slate-950 border-amber-400";
                document.getElementById('btn-part').
