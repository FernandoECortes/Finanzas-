<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Gastos - Fer</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Filtros temporales */
    .filtros-temporales {
      display: flex;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .filtros-temporales button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filtros-temporales button.activo {
      background: var(--accent);
      color: white;
    }

    /* Resumen calendario / período */
    .calendario-resumen {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .calendario-resumen h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .calendario-resumen p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Lista de movimientos */
    .lista-movimientos {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-movimiento {
      background: var(--card-bg);
      padding: 14px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .item-movimiento:hover {
      background: #273548;
      transform: translateY(-1px);
    }

    .item-movimiento div {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-movimiento strong {
      font-size: 0.95rem;
    }

    .item-movimiento small {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .gasto {
      color: var(--danger);
      font-weight: 600;
    }

    .ingreso {
      color: var(--success);
      font-weight: 600;
    }

    /* Modal de detalle */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-contenido {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-contenido h3 {
      margin-bottom: 12px;
      text-align: center;
    }

    .monto-modal {
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .detalles-lista {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .detalles-lista li {
      display: flex;
      justify-content: border-box;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      color: var(--text-muted);
    }

    .detalles-lista li strong {
      color: var(--text-main);
    }

    .acciones-modal {
      display: flex;
      gap: 10px;
    }

    .acciones-modal button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-rojo {
      background: var(--danger);
      color: white;
    }

    .btn-secundario {
      background: var(--border);
      color: var(--text-main);
    }

    .btn-primario {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Mis Finanzas</h1>
    
    <!-- Aquí se inyecta toda la pantalla de inicio con filtros y lista -->
    <div id="inicio-app"></div>
  </div>

  <!-- Contenedor para el Modal de Detalle -->
  <div id="contenedor-modal" class="modal-overlay"></div>

  <script>
    // Base de datos simulada de movimientos con hora y subcategoría
    let movimientos = [
      {
        id: 1,
        tipo: "gasto",
        monto: 7038.00,
        categoria: "Transporte",
        subcategoria: "Combustible",
        fecha: "2026-09-04",
        hora: "21:09",
        cuenta: "Puma Pris",
        nota: "Carga de combustible"
      },
      {
        id: 2,
        tipo: "gasto",
        monto: 5657.00,
        categoria: "Transporte",
        subcategoria: "Uber / Remís",
        fecha: "2026-09-05",
        hora: "01:21",
        cuenta: "Mercado Pago",
        nota: "Viaje nocturno"
      },
      {
        id: 3,
        tipo: "ingreso",
        monto: 45000.00,
        categoria: "Trabajo",
        subcategoria: "Viajes / Apps",
        fecha: "2026-09-01",
        hora: "14:30",
        cuenta: "Mercado Pago",
        nota: "Ganancias semanales"
      }
    ];

    let filtroSeleccionado = 'mes'; // Por defecto vista mensual
    let fechaReferencia = new Date();

    function cambiarFiltro(tipo) {
      filtroSeleccionado = tipo;
      renderizarPantallaInicio();
    }

    function filtrarMovimientosPorTiempo(lista) {
      return lista.filter(mov => {
        const fechaMov = new Date(mov.fecha + 'T00:00:00');
        
        if (filtroSeleccionado === 'semana') {
          return esMismaSemana(fechaMov, fechaReferencia);
        } else if (filtroSeleccionado === 'mes') {
          return fechaMov.getMonth() === fechaReferencia.getMonth() && 
                 fechaMov.getFullYear() === fechaReferencia.getFullYear();
        } else if (filtroSeleccionado === 'anio') {
          return fechaMov.getFullYear() === fechaReferencia.getFullYear();
        }
        return true;
      });
    }

    function esMismaSemana(fecha1, fecha2) {
      const inicioSemana = new Date(fecha2);
      inicioSemana.setDate(fecha2.getDate() - fecha2.getDay());
      const finSemana = new Date(inicioSemana);
      finSemana.setDate(inicioSemana.getDate() + 6);
      return fecha1 >= inicioSemana && fecha1 <= finSemana;
    }

    function renderizarPantallaInicio() {
      const movimientosFiltrados = filtrarMovimientosPorTiempo(movimientos);
      
      const contenedorInicio = document.getElementById('inicio-app');
      contenedorInicio.innerHTML = `
        <div class="filtros-temporales">
          <button class="${filtroSeleccionado === 'semana' ? 'activo' : ''}" onclick="cambiarFiltro('semana')">Semana</button>
          <button class="${filtroSeleccionado === 'mes' ? 'activo' : ''}" onclick="cambiarFiltro('mes')">Mes</button>
          <button class="${filtroSeleccionado === 'anio' ? 'activo' : ''}" onclick="cambiarFiltro('anio')">Año</button>
        </div>

        <div class="calendario-resumen">
          <h3>Resumen por ${filtroSeleccionado.toUpperCase()}</h3>
          <p>Mostrando ${movimientosFiltrados.length} movimiento(s) en este período</p>
        </div>

        <div class="lista-movimientos">
          ${movimientosFiltrados.length === 0 ? '<p style="text-align:center; color:var(--text-muted); padding: 20px;">No hay movimientos en este período.</p>' : ''}
          ${movimientosFiltrados.map(m => `
            <div class="item-movimiento" onclick="verDetalleMovimiento(${m.id})">
              <div>
                <strong>${m.categoria} <span style="color:var(--text-muted); font-weight:normal;">(${m.subcategoria})</span></strong>
                <small>${m.fecha} - ${m.hora} hs</small>
              </div>
              <span class="${m.tipo}">${m.tipo === 'gasto' ? '-' : '+'}$ ${m.monto.toLocaleString('es-AR')}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function verDetalleMovimiento(id) {
      const mov = movimientos.find(m => m.id === id);
      if (!mov) return;

      const modalHTML = `
        <div class="modal-contenido" onclick="event.stopPropagation()">
          <h3>Detalle del Movimiento</h3>
          <p class="monto-modal ${mov.tipo}">${mov.tipo === 'gasto' ? '-' : '+'}$ ${mov.monto.toLocaleString('es-AR')}</p>
          
          <ul class="detalles-lista">
            <li><span>Categoría</span> <strong>${mov.categoria}</strong></li>
            <li><span>Subcategoría</span> <strong>${mov.subcategoria}</strong></li>
            <li><span>Fecha</span> <strong>${mov.fecha}</strong></li>
            <li><span>Hora exacta</span> <strong>${mov.hora} hs</strong></li>
            <li><span>Cuenta / Medio</span> <strong>${mov.cuenta}</strong></li>
            <li><span>Nota</span> <strong>${mov.nota || 'Sin notas'}</strong></li>
          </ul>

          <div class="acciones-modal">
            <button onclick="cerrarModal()" class="btn-secundario">Cerrar</button>
            <button onclick="eliminarMovimiento(${mov.id})" class="btn-rojo">Eliminar</button>
          </div>
        </div>
      `;

      const modalContainer = document.getElementById('contenedor-modal');
      modalContainer.innerHTML = modalHTML;
      modalContainer.style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('contenedor-modal').style.display = 'none';
    }

    function eliminarMovimiento(id) {
      movimientos = movimientos.filter(m => m.id !== id);
      cerrarModal();
      renderizarPantallaInicio();
    }

    // Cerrar modal haciendo clic fuera de la tarjeta
    document.getElementById('contenedor-modal').addEventListener('click', cerrarModal);

    // Inicializar la app al cargar
    renderizarPantallaInicio();
  </script>
</body>
</html>
