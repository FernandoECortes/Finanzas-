<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monify Personal Pro Ultimate</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
        if (localStorage.getItem('monify_modo_claro') === 'true') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <meta name="theme-color" content="#18181b">
</head>
<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen font-sans antialiased pb-28 selection:bg-zinc-500 selection:text-white">

    <div x-data="finanzasApp()">
        <!-- Cabecera / Tarjeta de Resumen Financiero -->
        <header class="bg-white dark:bg-zinc-900 border-b border-zinc-200/80 dark:border-zinc-800/80 px-4 pt-4 pb-3 sticky top-0 z-10 shadow-sm transition-colors">
            <div class="max-w-md mx-auto flex justify-between items-center mb-4">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-950 flex items-center justify-center font-black text-xs tracking-wider shadow-sm">
                        M
                    </div>
                    <div>
                        <h1 class="text-sm font-bold tracking-tight">Monify</h1>
                        <p class="text-[10px] uppercase tracking-wider text-zinc-400 font-semibold" x-text="mesActual"></p>
                    </div>
                </div>
                <div class="flex items-center space-x-1.5">
                    <button @click="alternarTema()" class="w-8 h-8 rounded-xl bg-zinc-100 dark:bg-zinc-800/80 hover:bg-zinc-200 dark:hover:bg-zinc-700 flex items-center justify-center transition shadow-sm" title="Cambiar Tema">
                        <span class="text-xs" x-text="modoClaro ? '🌙' : '☀️'"></span>
                    </button>
                    <button @click="exportarDatos" class="text-[11px] font-medium bg-zinc-100 dark:bg-zinc-800/80 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-300 px-3 py-1.5 rounded-xl transition shadow-sm flex items-center space-x-1">
                        <span>📥</span>
                        <span class="hidden sm:inline">Respaldar</span>
                    </button>
                </div>
            </div>
            
            <!-- Tarjetas de Balance -->
            <div class="max-w-md mx-auto grid grid-cols-3 gap-2.5">
                <div class="bg-zinc-50 dark:bg-zinc-950/60 p-3 rounded-2xl border border-zinc-200/60 dark:border-zinc-800/60">
                    <p class="text-[10px] uppercase font-semibold tracking-wider text-zinc-400 mb-1">Ingresos</p>
                    <p class="text-xs sm:text-sm font-bold text-emerald-600 dark:text-emerald-400 truncate" x-text="formatearMoneda(totalIngresos)"></p>
                </div>
                <div class="bg-zinc-50 dark:bg-zinc-950/60 p-3 rounded-2xl border border-zinc-200/60 dark:border-zinc-800/60">
                    <p class="text-[10px] uppercase font-semibold tracking-wider text-zinc-400 mb-1">Gastos</p>
                    <p class="text-xs sm:text-sm font-bold text-rose-600 dark:text-rose-400 truncate" x-text="formatearMoneda(totalGastos)"></p>
                </div>
                <div class="bg-zinc-50 dark:bg-zinc-950/60 p-3 rounded-2xl border border-zinc-200/60 dark:border-zinc-800/60">
                    <p class="text-[10px] uppercase font-semibold tracking-wider text-zinc-400 mb-1">Neto</p>
                    <p class="text-xs sm:text-sm font-black truncate" :class="balanceNeto >= 0 ? 'text-zinc-900 dark:text-zinc-100' : 'text-rose-600 dark:text-rose-400'" x-text="formatearMoneda(balanceNeto)"></p>
                </div>
            </div>

            <!-- Navegación por pestañas -->
            <div class="max-w-md mx-auto grid grid-cols-4 gap-1 bg-zinc-100 dark:bg-zinc-950 p-1 rounded-2xl border border-zinc-200 dark:border-zinc-800/80 mt-3.5">
                <button @click="pestanaActiva = 'movimientos'" class="py-2 rounded-xl text-[11px] font-bold tracking-tight transition" :class="pestanaActiva === 'movimientos' ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm' : 'text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300'">Movimientos</button>
                <button @click="pestanaActiva = 'cuentas'" class="py-2 rounded-xl text-[11px] font-bold tracking-tight transition" :class="pestanaActiva === 'cuentas' ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm' : 'text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300'">Cuentas</button>
                <button @click="pestanaActiva = 'analisis'" class="py-2 rounded-xl text-[11px] font-bold tracking-tight transition" :class="pestanaActiva === 'analisis' ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm' : 'text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300'">Análisis</button>
                <button @click="pestanaActiva = 'cuotas'" class="py-2 rounded-xl text-[11px] font-bold tracking-tight transition" :class="pestanaActiva === 'cuotas' ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm' : 'text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300'">Cuotas</button>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="max-w-md mx-auto p-4 space-y-4">
            
            <!-- PESTAÑA: MOVIMIENTOS -->
            <div x-show="pestanaActiva === 'movimientos'" class="space-y-3">
                <div class="flex space-x-2">
                    <div class="relative w-full">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-zinc-400 text-xs">🔍</span>
                        <input type="text" x-model="filtroBusqueda" placeholder="Buscar concepto o categoría..." class="w-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800/80 rounded-2xl pl-9 pr-3 py-2.5 text-xs text-zinc-800 dark:text-zinc-200 focus:outline-none focus:border-zinc-400 dark:focus:border-zinc-600 shadow-sm transition">
                    </div>
                    <select x-model="filtroMes" class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800/80 rounded-2xl px-3 py-2.5 text-xs font-medium text-zinc-700 dark:text-zinc-300 focus:outline-none shadow-sm transition">
                        <option value="todos">Todos</option>
                        <template x-for="mes in mesesDisponibles" :key="mes">
                            <option :value="mes" x-text="mes"></option>
                        </template>
                    </select>
                </div>

                <div class="flex justify-between items-center pt-1 px-1">
                    <h2 class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">Historial reciente</h2>
                    <span class="text-[11px] font-medium text-zinc-400" x-text="transaccionesFiltradas.length + ' registros'"></span>
                </div>

                <template x-if="transaccionesFiltradas.length === 0">
                    <div class="text-center py-16 bg-white dark:bg-zinc-900/40 rounded-3xl border border-dashed border-zinc-200 dark:border-zinc-800 shadow-sm">
                        <div class="w-12 h-12 rounded-full bg-zinc-100 dark:bg-zinc-800/60 flex items-center justify-center mx-auto mb-3 text-lg">📂</div>
                        <p class="text-zinc-600 dark:text-zinc-400 text-sm font-semibold mb-1">No hay movimientos</p>
                        <p class="text-zinc-400 dark:text-zinc-600 text-xs">Usa el botón flotante '+' para registrar uno.</p>
                    </div>
                </template>

                <div class="space-y-2.5">
                    <template x-for="t in transaccionesFiltradas" :key="t.id">
                        <div class="bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800/80 p-3.5 rounded-2xl flex justify-between items-center shadow-sm hover:border-zinc-300 dark:hover:border-zinc-700 transition">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold text-sm shadow-sm"
                                     :class="obtenerClaseIcono(t.tipo)">
                                    <span x-text="obtenerSimboloIcono(t.tipo)"></span>
                                </div>
                                <div>
                                    <p class="text-xs sm:text-sm font-semibold text-zinc-900 dark:text-zinc-100" x-text="t.concepto"></p>
                                    <div class="flex items-center space-x-1.5 mt-1 flex-wrap gap-y-1">
                                        <span class="text-[10px] font-medium bg-zinc-100 dark:bg-zinc-800/80 text-zinc-600 dark:text-zinc-300 px-2 py-0.5 rounded-lg" x-text="t.tipo === 'traspaso' ? 'Traspaso' : t.categoria"></span>
                                        <span class="text-[10px] font-medium bg-zinc-50 dark:bg-zinc-950 border border-zinc-200/60 dark:border-zinc-800/60 text-zinc-500 dark:text-zinc-400 px-2 py-0.5 rounded-lg" x-text="t.tipo === 'traspaso' ? (t.cuentaOrigen + ' → ' + t.cuentaDestino) : t.subcategoria"></span>
                                        <span class="text-[10px] font-medium text-zinc-400" x-text="t.tipo === 'traspaso' ? '' : t.cuenta"></span>
                                        <span class="text-[10px] font-medium text-zinc-400" x-text="t.fechaFormateada"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right flex items-center space-x-1.5">
                                <div>
                                    <p class="text-xs sm:text-sm font-bold tracking-tight" 
                                       :class="t.tipo === 'ingreso' ? 'text-emerald-600 dark:text-emerald-400' : (t.tipo === 'traspaso' ? 'text-blue-600 dark:text-blue-400' : 'text-zinc-900 dark:text-zinc-100')"
                                       x-text="obtenerTextoMonto(t)">
                                    </p>
                                </div>
                                <div class="flex flex-col space-y-1">
                                    <button @click="abrirEditarTransaccion(t)" class="text-zinc-300 dark:text-zinc-600 hover:text-zinc-700 dark:hover:text-zinc-200 p-1 text-xs transition" title="Editar">✏️</button>
                                    <button @click="eliminarTransaccion(t.id)" class="text-zinc-300 dark:text-zinc-600 hover:text-rose-600 dark:hover:text-rose-400 p-1 text-xs transition" title="Eliminar">✕</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- PESTAÑA: CUENTAS Y BILLETERAS -->
            <div x-show="pestanaActiva === 'cuentas'" class="space-y-3.5" style="display: none;">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">Mis cuentas y billeteras</h2>
                    <button @click="abrirModalNuevaCuenta()" class="text-xs bg-zinc-900 dark:bg-zinc-100 hover:bg-zinc-800 dark:hover:bg-white text-white dark:text-zinc-950 px-3.5 py-2 rounded-xl font-semibold shadow-sm transition">+ Nueva Cuenta</button>
                </div>
                
                <div class="grid grid-cols-1 gap-2.5">
                    <template x-for="cta in cuentasListado" :key="cta.nombre">
                        <div class="bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800/80 p-4 rounded-2xl flex justify-between items-center shadow-sm hover:border-zinc-300 dark:hover:border-zinc-700 transition">
                            <div class="flex items-center space-x-3.5">
                                <div class="w-11 h-11 rounded-2xl bg-zinc-100 dark:bg-zinc-950 border border-zinc-200/60 dark:border-zinc-800/60 flex items-center justify-center text-xs font-bold text-zinc-800 dark:text-zinc-200 shadow-sm">
                                    <span x-text="cta.nombre.substring(0, 2).toUpperCase()"></span>
                                </div>
                                <div>
                                    <p class="text-sm font-bold text-zinc-900 dark:text-zinc-100" x-text="cta.nombre"></p>
                                    <p class="text-xs font-semibold mt-0.5" :class="cta.saldo >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'" x-text="formatearMoneda(cta.saldo)"></p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-1">
                                <button @click="abrirEditarCuenta(cta.nombre)" class="text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 p-2 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800 transition text-xs">✏️</button>
                                <button @click="eliminarCuenta(cta.nombre)" class="text-zinc-400 hover:text-rose-600 dark:hover:text-rose-400 p-2 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800 transition text-xs">✕</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- PESTAÑA: ANÁLISIS Y GRÁFICOS AVANZADOS -->
            <div x-show="pestanaActiva === 'analisis'" class="space-y-4" style="display: none;" x-cloak>
                
                <!-- Selector de Periodo de Análisis -->
                <div class="grid grid-cols-3 gap-1 bg-white dark:bg-zinc-900 p-1.5 rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm">
                    <button @click="periodoAnalisis = 'semana'" class="py-2 rounded-xl text-xs font-bold transition" :class="periodoAnalisis === 'semana' ? 'bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-950 shadow-sm' : 'text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200'">Semana</button>
                    <button @click="periodoAnalisis = 'mes'" class="py-2 rounded-xl text-xs font-bold transition" :class="periodoAnalisis === 'mes' ? 'bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-950 shadow-sm' : 'text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200'">Mes</button>
                    <button @click="periodoAnalisis = 'anio'" class="py-2 rounded-xl text-xs font-bold transition" :class="periodoAnalisis === 'anio' ? 'bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-950 shadow-sm' : 'text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200'">Año</button>
                </div>

                <!-- Tarjetas de Métricas Clave del Periodo -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div class="bg-white dark:bg-zinc-900 p-3.5 rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm">
                        <p class="text-[10px] uppercase font-bold tracking-wider text-zinc-400 mb-1">Gasto Promedio Diario</p>
                        <p class="text-sm font-black text-zinc-900 dark:text-zinc-100" x-text="formatearMoneda(metricasAnalisis.promedioDiario)"></p>
                    </div>
                    <div class="bg-white dark:bg-zinc-900 p-3.5 rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm">
                        <p class="text-[10px] uppercase font-bold tracking-wider text-zinc-400 mb-1">Tasa de Ahorro</p>
                        <p class="text-sm font-black" :class="metricasAnalisis.tasaAhorro >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'" x-text="metricasAnalisis.tasaAhorro + '%'"></p>
                    </div>
                </div>

                <div class="bg-white dark:bg-zinc-900 p-4 rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm flex justify-between items-center">
                    <div>
                        <p class="text-[10px] uppercase font-bold tracking-wider text-zinc-400">Categoría Mayor Gasto</p>
                        <p class="text-sm font-bold text-zinc-900 dark:text-zinc-100 mt-0.5" x-text="metricasAnalisis.mayorCategoria.nombre"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-semibold text-rose-600 dark:text-rose-400" x-text="formatearMoneda(metricasAnalisis.mayorCategoria.monto)"></p>
                        <p class="text-[10px] text-zinc-400" x-text="metricasAnalisis.mayorCategoria.porcentaje + '% del total'"></p>
                    </div>
                </div>

                <!-- Presupuestos en el Periodo -->
                <div class="space-y-3 bg-white dark:bg-zinc-900 p-4 rounded-3xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm">
                    <h2 class="text-[11px] font-bold uppercase tracking-wider text-zinc-400 px-1">Presupuestos y Limites</h2>
                    <div class="space-y-2">
                        <template x-for="cat in categoriasGastosNombres" :key="cat">
                            <div class="flex justify-between items-center text-xs bg-zinc-50 dark:bg-zinc-950 p-3 rounded-2xl border border-zinc-200/60 dark:border-zinc-800/60">
                                <span class="font-semibold text-zinc-800 dark:text-zinc-200 truncate pr-2" x-text="cat"></span>
                                <div class="flex items-center space-x-2 shrink-0">
                                    <span class="text-zinc-400 text-[11px]" x-text="formatearMoneda(gastosPorCatMapaPeriodo[cat] || 0) + ' / '"></span>
                                    <input type="number" step="0.01" class="w-20 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-xl px-2.5 py-1.5 text-right text-xs font-bold shadow-sm focus:outline-none"
                                           :value="presupuestos[cat] || 0" @change="actualizarPresupuesto(cat, $event.target.value)">
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Distribución Detallada por Categoría -->
                <div class="space-y-3 bg-white dark:bg-zinc-900 p-4 rounded-3xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm">
                    <h2 class="text-[11px] font-bold uppercase tracking-wider text-zinc-400 px-1">Desglose de Gastos</h2>
                    <template x-if="gastosFiltradosPeriodo.length === 0">
                        <p class="text-zinc-400 text-xs text-center py-6">Sin gastos registrados en este período.</p>
                    </template>
                    <div class="space-y-3" x-show="gastosFiltradosPeriodo.length > 0">
                        <template x-for="item in desgloseCategoriasPeriodo" :key="item.categoria">
                            <div class="space-y-1.5 bg-zinc-50 dark:bg-zinc-950 p-3 rounded-2xl border border-zinc-200/60 dark:border-zinc-800/60">
                                <div class="flex justify-between text-xs">
                                    <span class="text-zinc-800 dark:text-zinc-200 font-semibold" x-text="item.categoria"></span>
                                    <span class="text-zinc-500 font-medium" x-text="formatearMoneda(item.monto) + ' (' + item.porcentaje + '%)'"></span>
                                </div>
                                <div class="w-full bg-zinc-200 dark:bg-zinc-900 h-2 rounded-full overflow-hidden">
                                    <div class="h-full rounded-full transition-all duration-500" 
                                         :class="verificarPresupuestoExcedido(item.categoria, item.monto) ? 'bg-rose-600' : 'bg-zinc-900 dark:bg-zinc-100'"
                                         :style="'width: ' + Math.min(item.porcentaje, 100) + '%'"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Evolución Histórica General -->
                <div class="space-y-3 bg-white dark:bg-zinc-900 p-4 rounded-3xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm">
                    <h2 class="text-[11px] font-bold uppercase tracking-wider text-zinc-400 px-1">Evolución Histórica por Mes</h2>
                    <div class="space-y-2">
                        <template x-for="h in historicoMensual" :key="h.mes">
                            <div class="bg-zinc-50 dark:bg-zinc-950 p-3.5 rounded-2xl border border-zinc-200/60 dark:border-zinc-800/60 flex justify-between items-center text-xs">
                                <span class="font-bold text-zinc-900 dark:text-zinc-100" x-text="h.mes"></span>
                                <div class="text-right">
                                    <span class="text-emerald-600 dark:text-emerald-400 font-semibold mr-2" x-text="'+ ' + formatearMoneda(h.ingresos)"></span>
                                    <span class="text-rose-600 dark:text-rose-400 font-semibold" x-text="'- ' + formatearMoneda(h.gastos)"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            </div>

            <!-- PESTAÑA: CONTROL DE CUOTAS -->
            <div x-show="pestanaActiva === 'cuotas'" class="space-y-3.5" style="display: none;">
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">Financiaciones activas</h2>
                    <button @click="abrirModalCuota = true" class="text-xs bg-zinc-900 dark:bg-zinc-100 hover:bg-zinc-800 dark:hover:bg-white text-white dark:text-zinc-950 px-3.5 py-2 rounded-xl font-semibold shadow-sm transition">+ Nueva Cuota</button>
                </div>

                <template x-if="cuotas.length === 0">
                    <div class="text-center py-16 bg-white dark:bg-zinc-900/40 rounded-3xl border border-dashed border-zinc-200 dark:border-zinc-800 shadow-sm">
                        <div class="w-12 h-12 rounded-full bg-zinc-100 dark:bg-zinc-800/60 flex items-center justify-center mx-auto mb-3 text-lg">💳</div>
                        <p class="text-zinc-600 dark:text-zinc-400 text-sm font-semibold mb-1">No hay cuotas pendientes</p>
                        <p class="text-zinc-400 dark:text-zinc-600 text-xs">Controla tus compras financiadas aquí.</p>
                    </div>
                </template>

                <div class="space-y-2.5">
                    <template x-for="c in cuotas" :key="c.id">
                        <div class="bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800/80 p-4 rounded-2xl space-y-3 shadow-sm">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm font-bold text-zinc-900 dark:text-zinc-100" x-text="c.concepto"></p>
                                    <p class="text-xs text-zinc-500 mt-0.5">Cuota mensual: <span class="text-zinc-800 dark:text-zinc-200 font-semibold" x-text="formatearMoneda(c.valorCuota)"></span></p>
                                </div>
                                <button @click="eliminarCuota(c.id)" class="text-zinc-400 hover:text-rose-600 p-1.5 text-xs transition">✕</button>
                            </div>
                            <div class="flex justify-between items-center text-xs pt-2.5 border-t border-zinc-100 dark:border-zinc-800">
                                <span class="text-zinc-500 font-medium">Cuota <strong class="text-zinc-900 dark:text-zinc-100" x-text="c.cuotaActual"></strong> de <strong class="text-zinc-900 dark:text-zinc-100" x-text="c.totalCuotas"></strong></span>
                                <button @click="avanzarCuota(c.id)" class="bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-800 dark:text-zinc-200 px-3 py-1.5 rounded-xl font-semibold text-[11px] transition shadow-sm">Avanzar Mes (+1)</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

        </main>

        <!-- Botón Flotante Principal -->

    <!-- Lógica de la App -->
    <script>
        function finanzasApp() {
            return {
                pestanaActiva: 'movimientos',
                periodoAnalisis: 'mes', // 'semana', 'mes', 'anio'
                abrirModalTransaccion: false,
                abrirModalCuota: false,
                abrirModalCuenta: false,
                editandoId: null,
                cuentaEditandoVieja: null,
                nombreNuevaCuenta: '',
                filtroBusqueda: '',
                filtroMes: 'todos',
                modoClaro: localStorage.getItem('monify_modo_claro') === 'true',
                
                transacciones: JSON.parse(localStorage.getItem('monify_transacciones_v10')) || [],
                cuotas: JSON.parse(localStorage.getItem('monify_cuotas_v10')) || [],
                presupuestos: JSON.parse(localStorage.getItem('monify_presupuestos_v10')) || {},
                listaNombresCuentas: JSON.parse(localStorage.getItem('monify_cuentas_v10')) || [
                    'Efectivo', 'Astropay', 'BBVA', 'Brubank', 'Carrefour', 'ClaroPay', 'Cocos', 'IOL', 'Lemon', 'Mercado Pago', 'Naranja X', 'Personal Pay'
                ],
                
                estructuraGastos: {
                    "Vivienda y Hogar": ["Alquiler o cuota hipotecaria", "Impuestos y tasas", "Expensas / Mantenimiento", "Equipamiento"],
                    "Alimentación y Compras": ["Supermercado y almacén", "Verdulería y carnicería", "Comidas fuera y delivery"],
                    "Servicios Básicos y Conectividad": ["Energía eléctrica", "Gas", "Agua", "Telecomunicaciones"],
                    "Movilidad y Transporte": ["Vehículo particular", "Transporte público", "Transporte alternativo", "Moto o bicicleta"],
                    "Salud y Bienestar": ["Cobertura médica", "Farmacia y medicamentos", "Atención profesional", "Cuidado personal", "Gimnasio y deportes"],
                    "Ocio y Entretenimiento": ["Salidas y cultura", "Viajes y turismo", "Hobbies", "Mascotas"],
                    "Educación y Desarrollo": ["Estudio", "Materiales"],
                    "Finanzas, Impuestos y Varios": ["Servicios financieros", "Seguros adicionales", "Indumentaria y calzado", "Imprevistos y regalos"]
                },

                formT: { 
                    tipo: 'gasto', monto: '', concepto: '', categoria: 'Vivienda y Hogar', subcategoria: 'Alquiler o cuota hipotecaria', cuenta: 'Mercado Pago', cuentaOrigen: 'Mercado Pago', cuentaDestino: 'Efectivo'
                },
                formC: { concepto: '', valorCuota: '', totalCuotas: 3, cuotaActual: 1 },

                get categoriasGastosNombres() { return Object.keys(this.estructuraGastos); },
                get subcategoriasDisponibles() { return this.estructuraGastos[this.formT.categoria] || []; },
                get mesActual() {
                    const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                    const fecha = new Date();
                    return `${meses[fecha.getMonth()]} ${fecha.getFullYear()}`;
                },
                get mesesDisponibles() {
                    const setMeses = new Set();
                    this.transacciones.forEach(t => { if (t.mesAnio) setMeses.add(t.mesAnio); });
                    return Array.from(setMeses);
                },
                get transaccionesFiltradas() {
                    return this.transacciones.filter(t => {
                        const coincideBusqueda = t.concepto.toLowerCase().includes(this.filtroBusqueda.toLowerCase()) || 
                                               t.categoria.toLowerCase().includes(this.filtroBusqueda.toLowerCase()) ||
                                               (t.subcategoria && t.subcategoria.toLowerCase().includes(this.filtroBusqueda.toLowerCase()));
                        const coincideMes = this.filtroMes === 'todos' || t.mesAnio === this.filtroMes;
                        return coincideBusqueda && coincideMes;
                    });
                },
                get totalIngresos() { return this.transaccionesFiltradas.filter(t => t.tipo === 'ingreso').reduce((acc, t) => acc + t.monto, 0); },
                get totalGastos() { return this.transaccionesFiltradas.filter(t => t.tipo === 'gasto').reduce((acc, t) => acc + t.monto, 0); },
                get balanceNeto() { return this.totalIngresos - this.totalGastos; },
                
                // Lógica avanzada para Análisis por Semana / Mes / Año
                get gastosFiltradosPeriodo() {
                    const ahora = new Date();
                    return this.transacciones.filter(t => {
                        if (t.tipo !== 'gasto') return false;
                        // Si el formato de fecha es DD/MM/YY
                        const partes = t.fechaFormateada.split('/');
                        if (partes.length !== 3) return true;
                        const fechaT = new Date(`20${partes[2]}`, partes[1] - 1, partes[0]);

                        if (this.periodoAnalisis === 'semana') {
                            const unDiaMs = 24 * 60 * 60 * 1000;
                            const diffDias = Math.abs((ahora - fechaT) / unDiaMs);
                            return diffDias <= 7;
                        } else if (this.periodoAnalisis === 'mes') {
                            return fechaT.getMonth() === ahora.getMonth() && fechaT.getFullYear() === ahora.getFullYear();
                        } else if (this.periodoAnalisis === 'anio') {
                            return fechaT.getFullYear() === ahora.getFullYear();
                        }
                        return true;
                    });
                },

                get ingresosFiltradosPeriodo() {
                    const ahora = new Date();
                    return this.transacciones.filter(t => {
                        if (t.tipo !== 'ingreso') return false;
                        const partes = t.fechaFormateada.split('/');
                        if (partes.length !== 3) return true;
                        const fechaT = new Date(`20${partes[2]}`, partes[1] - 1, partes[0]);

                        if (this.periodoAnalisis === 'semana') {
                            return Math.abs((ahora - fechaT) / (24 * 60 * 60 * 1000)) <= 7;
                        } else if (this.periodoAnalisis === 'mes') {
                            return fechaT.getMonth() === ahora.getMonth() && fechaT.getFullYear() === ahora.getFullYear();
                        } else if (this.periodoAnalisis === 'anio') {
                            return fechaT.getFullYear() === ahora.getFullYear();
                        }
                        return true;
                    });
                },

                get gastosPorCatMapaPeriodo() {
                    const agrupados = {};
                    this.gastosFiltradosPeriodo.forEach(t => {
                        agrupados[t.categoria] = (agrupados[t.categoria] || 0) + t.monto;
                    });
                    return agrupados;
                },

                get desgloseCategoriasPeriodo() {
                    const total = this.gastosFiltradosPeriodo.reduce((acc, t) => acc + t.monto, 0);
                    if (total === 0) return [];
                    const agrupados = this.gastosPorCatMapaPeriodo;
                    return Object.keys(agrupados).map(cat => ({
                        categoria: cat, monto: agrupados[cat], porcentaje: Math.round((agrupados[cat] / total) * 100)
                    })).sort((a, b) => b.monto - a.monto);
                },

                get metricasAnalisis() {
                    const totalG = this.gastosFiltradosPeriodo.reduce((acc, t) => acc + t.monto, 0);
                    const totalI = this.ingresosFiltradosPeriodo.reduce((acc, t) => acc + t.monto, 0);
                    
                    let divisorDias = 7;
                    if (this.periodoAnalisis === 'mes') divisorDias = 30;
                    if (this.periodoAnalisis === 'anio') divisorDias = 365;

                    const promedioDiario = totalG / divisorDias;
                    const tasaAhorro = totalI > 0 ? Math.round(((totalI - totalG) / totalI) * 100) : 0;

                    const desglose = this.desgloseCategoriasPeriodo;
                    const mayor = desglose.length > 0 ? desglose[0] : { categoria: 'Sin datos', monto: 0, porcentaje: 0 };

                    return {
                        promedioDiario,
                        tasaAhorro,
                        mayorCategoria: { nombre: mayor.categoria, monto: mayor.monto, porcentaje: mayor.porcentaje }
                    };
                },

                get cuentasListado() {
                    const saldos = {};
                    this.listaNombresCuentas.forEach(c => saldos[c] = 0);
                    this.transacciones.forEach(t => {
                        if (t.tipo === 'ingreso') { if (saldos[t.cuenta] !== undefined) saldos[t.cuenta] += t.monto; }
                        else if (t.tipo === 'gasto') { if (saldos[t.cuenta] !== undefined) saldos[t.cuenta] -= t.monto; }
                        else if (t.tipo === 'traspaso') {
                            if (saldos[t.cuentaOrigen] !== undefined) saldos[t.cuentaOrigen] -= t.monto;
                            if (saldos[t.cuentaDestino] !== undefined) saldos[t.cuentaDestino] += t.monto;
                        }
                    });
                    return this.listaNombresCuentas.map(nombre => ({ nombre, saldo: saldos[nombre] !== undefined ? saldos[nombre] : 0 }));
                },
                
                get historicoMensual() {
                    const mapaMeses = {};
                    this.transacciones.forEach(t => {
                        if (!t.mesAnio) return;
                        if (!mapaMeses[t.mesAnio]) mapaMeses[t.mesAnio] = { ingresos: 0, gastos: 0 };
                        if (t.tipo === 'ingreso') mapaMeses[t.mesAnio].ingresos += t.monto;
                        if (t.tipo === 'gasto') mapaMeses[t.mesAnio].gastos += t.monto;
                    });
                    return Object.keys(mapaMeses).map(mes => ({ mes, ingresos: mapaMeses[mes].ingresos, gastos: mapaMeses[mes].gastos }));
                },

                alternarTema() {
                    this.modoClaro = !this.modoClaro;
                    localStorage.setItem('monify_modo_claro', this.modoClaro);
                    if (this.modoClaro) {
                        document.documentElement.classList.remove('dark');
                    } else {
                        document.documentElement.classList.add('dark');
                    }
                },
                obtenerClaseIcono(tipo) {
                    if (tipo === 'ingreso') return 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20';
                    if (tipo === 'traspaso') return 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20';
                    return 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20';
                },
                obtenerSimboloIcono(tipo) {
                    if (tipo === 'ingreso') return '↓';
                    if (tipo === 'traspaso') return '⇄';
                    return '↑';
                },
                obtenerTextoMonto(t) {
                    if (t.tipo === 'ingreso') return '+ ' + this.formatearMoneda(t.monto);
                    if (t.tipo === 'traspaso') return this.formatearMoneda(t.monto);
                    return '- ' + this.formatearMoneda(t.monto);
                },
                verificarPresupuestoExcedido(cat, monto) {
                    return this.presupuestos[cat] && monto > this.presupuestos[cat];
                },
                cambiarCategoriaPrincipal() {
                    const subs = this.subcategoriasDisponibles;
                    if (subs.length > 0) this.formT.subcategoria = subs[0];
                },
                actualizarListas() {
                    if (this.editandoId) return;
                    if (this.formT.tipo === 'gasto') {
                        this.formT.categoria = 'Vivienda y Hogar';
                        this.cambiarCategoriaPrincipal();
                    } else if (this.formT.tipo === 'ingreso') {
                        this.formT.categoria = 'Sueldo / Trabajo';
                        this.formT.subcategoria = 'Principal';
                    }
                },
                actualizarPresupuesto(cat, valor) {
                    this.presupuestos[cat] = Number(Number(valor).toFixed(2));
                    localStorage.setItem('monify_presupuestos_v10', JSON.stringify(this.presupuestos));
                },
                abrirNuevaTransaccion() {
                    this.editandoId = null;
                    this.formT = { tipo: 'gasto', monto: '', concepto: '', categoria: 'Vivienda y Hogar', subcategoria: 'Alquiler o cuota hipotecaria', cuenta: this.listaNombresCuentas[0] || 'Efectivo', cuentaOrigen: this.listaNombresCuentas[0], cuentaDestino: this.listaNombresCuentas[1] || 'Efectivo' };
                    this.actualizarListas();
                    this.abrirModalTransaccion = true;
                },
                abrirEditarTransaccion(t) {
                    this.editandoId = t.id;
                    this.formT = {
                        tipo: t.tipo, monto: t.monto, concepto: t.concepto,
                        categoria: t.categoria || 'Vivienda y Hogar', subcategoria: t.subcategoria || '',
                        cuenta: t.cuenta || 'Mercado Pago', cuentaOrigen: t.cuentaOrigen || 'Mercado Pago', cuentaDestino: t.cuentaDestino || 'Efectivo'
                    };
                    this.abrirModalTransaccion = true;
                },
                abrirModalNuevaCuenta() {
                    this.cuentaEditandoVieja = null; this.nombreNuevaCuenta = ''; this.abrirModalCuenta = true;
                },
                abrirEditarCuenta(nombreActual) {
                    this.cuentaEditandoVieja = nombreActual; this.nombreNuevaCuenta = nombreActual; this.abrirModalCuenta = true;
                },
                guardarCuenta() {
                    const nombreLimpio = this.nombreNuevaCuenta.trim();
                    if (!nombreLimpio) return;
                    if (this.cuentaEditandoVieja) {
                        if (this.listaNombresCuentas.includes(nombreLimpio) && nombreLimpio !== this.cuentaEditandoVieja) return alert('Ya existe.');
                        this.listaNombresCuentas = this.listaNombresCuentas.map(c => c === this.cuentaEditandoVieja ? nombreLimpio : c);
                        this.transacciones = this.transacciones.map(t => {
                            if (t.cuenta === this.cuentaEditandoVieja) t.cuenta = nombreLimpio;
                            if (t.cuentaOrigen === this.cuentaEditandoVieja) t.cuentaOrigen = nombreLimpio;
                            if (t.cuentaDestino === this.cuentaEditandoVieja) t.cuentaDestino = nombreLimpio;
                            return t;
                        });
                        this.sincronizarStorage();
                    } else {
                        if (this.listaNombresCuentas.includes(nombreLimpio)) return alert('Ya existe.');
                        this.listaNombresCuentas.push(nombreLimpio);
                    }
                    this.sincronizarStorageCuentas();
                    this.abrirModalCuenta = false;
                },
                eliminarCuenta(nombreCuenta) {
                    if (this.listaNombresCuentas.length <= 1) return alert('Debes conservar al menos una.');
                    if (confirm(`¿Eliminar "${nombreCuenta}"?`)) {
                        this.listaNombresCuentas = this.listaNombresCuentas.filter(c => c !== nombreCuenta);
                        this.transacciones = this.transacciones.filter(t => t.cuenta !== nombreCuenta && t.cuentaOrigen !== nombreCuenta && t.cuentaDestino !== nombreCuenta);
                        this.sincronizarStorageCuentas();
                        this.sincronizarStorage();
                    }
                },
                guardarTransaccion() {
                    if (!this.formT.monto || !this.formT.concepto) return;
                    if (this.editandoId) {
                        this.transacciones = this.transacciones.map(t => {
                            if (t.id === this.editandoId) {
                                return {
                                    ...t,
                                    tipo: this.formT.tipo,
                                    monto: Number(Number(this.formT.monto).toFixed(2)),
                                    concepto: this.formT.concepto,
                                    categoria: this.formT.tipo === 'traspaso' ? 'Traspaso' : this.formT.categoria,
                                    subcategoria: this.formT.tipo === 'gasto' ? this.formT.subcategoria : (this.formT.tipo === 'traspaso' ? 'Movimiento interno' : 'Ingresos'),
                                    cuenta: this.formT.tipo === 'traspaso' ? '' : this.formT.cuenta,
                                    cuentaOrigen: this.formT.tipo === 'traspaso' ? this.formT.cuentaOrigen : '',
                                    cuentaDestino: this.formT.tipo === 'traspaso' ? this.formT.cuentaDestino : ''
                                };
                            }
                            return t;
                        });
                    } else {
                        const d = new Date();
                        const mesesNombres = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                        const mesAnioStr = `${mesesNombres[d.getMonth()]} ${d.getFullYear()}`;
                        const nueva = {
                            id: Date.now(),
                            tipo: this.formT.tipo,
                            monto: Number(Number(this.formT.monto).toFixed(2)),
                            concepto: this.formT.concepto,
                            categoria: this.formT.tipo === 'traspaso' ? 'Traspaso' : this.formT.categoria,
                            subcategoria: this.formT.tipo === 'gasto' ? this.formT.subcategoria : (this.formT.tipo === 'traspaso' ? 'Movimiento interno' : 'Ingresos'),
                            cuenta: this.formT.tipo === 'traspaso' ? '' : this.formT.cuenta,
                            cuentaOrigen: this.formT.tipo === 'traspaso' ? this.formT.cuentaOrigen : '',
                            cuentaDestino: this.formT.tipo === 'traspaso' ? this.formT.cuentaDestino : '',
                            fechaFormateada: d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' }),
                            mesAnio: mesAnioStr
                        };
                        this.transacciones.unshift(nueva);
                    }
                    this.sincronizarStorage();
                    this.abrirModalTransaccion = false;
                },
                eliminarTransaccion(id) {
                    if (confirm('¿Eliminar movimiento?')) {
                        this.transacciones = this.transacciones.filter(t => t.id !== id);
                        this.sincronizarStorage();
                    }
                },
                guardarCuota() {
                    if (!this.formC.concepto || !this.formC.valorCuota) return;
                    this.cuotas.unshift({
                        id: Date.now(), concepto: this.formC.concepto,
                        valorCuota: Number(Number(this.formC.valorCuota).toFixed(2)),
                        totalCuotas: Number(this.formC.totalCuotas), cuotaActual: 1
                    });
                    this.sincronizarStorageCuotas();
                    this.formC.concepto = ''; this.formC.valorCuota = '';
                    this.abrirModalCuota = false;
                },
                avanzarCuota(id) {
                    this.cuotas = this.cuotas.map(c => {
                        if (c.id === id) {
                            if (c.cuotaActual < c.totalCuotas) c.cuotaActual++;
                            else alert('¡Finalizada!');
                        }
                        return c;
                    });
                    this.sincronizarStorageCuotas();
                },
                eliminarCuota(id) {
                    if (confirm('¿Eliminar cuota?')) {
                        this.cuotas = this.cuotas.filter(c => c.id !== id);
                        this.sincronizarStorageCuotas();
                    }
                },
                exportarDatos() {
                    const datos = { transacciones: this.transacciones, cuotas: this.cuotas, cuentas: this.listaNombresCuentas, presupuestos: this.presupuestos };
                    const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = 'respaldo_finanzas_ultimate.json'; a.click();
                },
                sincronizarStorage() { localStorage.setItem('monify_transacciones_v10', JSON.stringify(this.transacciones)); },
                sincronizarStorageCuotas() { localStorage.setItem('monify_cuotas_v10', JSON.stringify(this.cuotas)); },
                sincronizarStorageCuentas() { localStorage.setItem('monify_cuentas_v10', JSON.stringify(this.listaNombresCuentas)); },
                formatearMoneda(valor) {
                    return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(valor);
                }
            }
        }
    </script>
</body>
