<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monify Personal - Finanzas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <meta name="theme-color" content="#18181b">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased pb-28" x-data="finanzasApp()">

    <!-- Cabecera / Resumen General -->
    <header class="bg-zinc-900 border-b border-zinc-800 p-4 sticky top-0 z-10 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center mb-3">
            <div>
                <h1 class="text-base font-bold tracking-tight text-zinc-100">Monify Personal</h1>
                <p class="text-[11px] text-zinc-400" x-text="mesActual"></p>
            </div>
            <div class="flex items-center space-x-2">
                <button @click="exportarDatos" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1 rounded-lg transition" title="Exportar Respaldo">📥 Respaldar</button>
            </div>
        </div>
        
        <!-- Tarjetas de Balance -->
        <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
            <div class="bg-zinc-950/70 p-2.5 rounded-xl border border-zinc-800/80">
                <p class="text-[10px] text-zinc-400 mb-0.5">Ingresos</p>
                <p class="text-xs sm:text-sm font-semibold text-emerald-400 truncate" x-text="formatearMoneda(totalIngresos)"></p>
            </div>
            <div class="bg-zinc-950/70 p-2.5 rounded-xl border border-zinc-800/80">
                <p class="text-[10px] text-zinc-400 mb-0.5">Gastos</p>
                <p class="text-xs sm:text-sm font-semibold text-rose-400 truncate" x-text="formatearMoneda(totalGastos)"></p>
            </div>
            <div class="bg-zinc-950/70 p-2.5 rounded-xl border border-zinc-800/80">
                <p class="text-[10px] text-zinc-400 mb-0.5">Neto / Balance</p>
                <p class="text-xs sm:text-sm font-bold truncate" :class="balanceNeto >= 0 ? 'text-zinc-100' : 'text-rose-400'" x-text="formatearMoneda(balanceNeto)"></p>
            </div>
        </div>

        <!-- Navegación por pestañas tipo Monify -->
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1 bg-zinc-950 p-1 rounded-xl border border-zinc-800 mt-3">
            <button @click="pestanaActiva = 'movimientos'" class="py-1.5 rounded-lg text-[11px] font-semibold transition" :class="pestanaActiva === 'movimientos' ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-400'">Movimientos</button>
            <button @click="pestanaActiva = 'cuentas'" class="py-1.5 rounded-lg text-[11px] font-semibold transition" :class="pestanaActiva === 'cuentas' ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-400'">Cuentas</button>
            <button @click="pestanaActiva = 'analisis'" class="py-1.5 rounded-lg text-[11px] font-semibold transition" :class="pestanaActiva === 'analisis' ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-400'">Análisis</button>
            <button @click="pestanaActiva = 'cuotas'" class="py-1.5 rounded-lg text-[11px] font-semibold transition" :class="pestanaActiva === 'cuotas' ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-400'">Cuotas</button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- PESTAÑA: MOVIMIENTOS -->
        <div x-show="pestanaActiva === 'movimientos'" class="space-y-3">
            <!-- Barra de búsqueda y filtros rápidos -->
            <div class="flex space-x-2">
                <input type="text" x-model="filtroBusqueda" placeholder="Buscar concepto o categoría..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-200 focus:outline-none focus:border-zinc-600">
                <select x-model="filtroMes" class="bg-zinc-900 border border-zinc-800 rounded-xl px-2.5 py-2 text-xs text-zinc-300 focus:outline-none">
                    <option value="todos">Todos los meses</option>
                    <template x-for="mes in mesesDisponibles" :key="mes">
                        <option :value="mes" x-text="mes"></option>
                    </template>
                </select>
            </div>

            <div class="flex justify-between items-center pt-1">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Historial</h2>
                <span class="text-[11px] text-zinc-500" x-text="transaccionesFiltradas.length + ' registros encontrados'"></span>
            </div>

            <!-- Lista vacía -->
            <template x-if="transaccionesFiltradas.length === 0">
                <div class="text-center py-12 bg-zinc-900/40 rounded-2xl border border-dashed border-zinc-800">
                    <p class="text-zinc-400 text-sm mb-1">No hay movimientos con estos filtros</p>
                    <p class="text-zinc-600 text-xs">Usa el botón '+' para registrar uno nuevo.</p>
                </div>
            </template>

            <!-- Listado de transacciones -->
            <div class="space-y-2">
                <template x-for="t in transaccionesFiltradas" :key="t.id">
                    <div class="bg-zinc-900/80 border border-zinc-800/80 p-3 rounded-2xl flex justify-between items-center shadow-sm">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-sm"
                                 :class="t.tipo === 'ingreso' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'">
                                <span x-text="t.tipo === 'ingreso' ? '↓' : '↑'"></span>
                            </div>
                            <div>
                                <p class="text-xs sm:text-sm font-medium text-zinc-200" x-text="t.concepto"></p>
                                <div class="flex items-center space-x-2 mt-0.5 flex-wrap gap-y-1">
                                    <span class="text-[10px] bg-zinc-800 text-zinc-300 px-1.5 py-0.5 rounded" x-text="t.categoria"></span>
                                    <span class="text-[10px] text-zinc-500" x-text="t.cuenta"></span>
                                    <span class="text-[10px] text-zinc-600" x-text="t.fechaFormateada"></span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right flex items-center space-x-2">
                            <div>
                                <p class="text-xs sm:text-sm font-semibold" 
                                   :class="t.tipo === 'ingreso' ? 'text-emerald-400' : 'text-zinc-100'"
                                   x-text="(t.tipo === 'ingreso' ? '+ ' : '- ') + formatearMoneda(t.monto)">
                                </p>
                            </div>
                            <button @click="eliminarTransaccion(t.id)" class="text-zinc-600 hover:text-rose-400 transition p-1 text-xs">✕</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- PESTAÑA: CUENTAS Y BILLETERAS -->
        <div x-show="pestanaActiva === 'cuentas'" class="space-y-3" style="display: none;">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Saldo por Cuenta / Billetera</h2>
            
            <div class="grid grid-cols-1 gap-2.5">
                <template x-for="cta in cuentasListado" :key="cta.nombre">
                    <div class="bg-zinc-900 border border-zinc-800 p-3.5 rounded-2xl flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-zinc-950 border border-zinc-800 flex items-center justify-center text-base">
                                <span x-text="cta.icono"></span>
                            </div>
                            <div>
                                <p class="text-sm font-semibold text-zinc-200" x-text="cta.nombre"></p>
                                <p class="text-[11px] text-zinc-500" x-text="cta.descripcion"></p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-bold" :class="cta.saldo >= 0 ? 'text-emerald-400' : 'text-rose-400'" x-text="formatearMoneda(cta.saldo)"></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- PESTAÑA: ANÁLISIS Y GRÁFICOS -->
        <div x-show="pestanaActiva === 'analisis'" class="space-y-4" style="display: none;">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Análisis de Gastos por Categoría</h2>
            </div>

            <template x-if="totalGastos === 0">
                <div class="text-center py-12 bg-zinc-900/40 rounded-2xl border border-dashed border-zinc-800">
                    <p class="text-zinc-400 text-sm">Sin datos para graficar todavía.</p>
                </div>
            </template>

            <!-- Barras con porcentaje -->
            <div class="space-y-3 bg-zinc-900/60 p-4 rounded-2xl border border-zinc-800/80" x-show="totalGastos > 0">
                <template x-for="item in gastosPorCategoria" :key="item.categoria">
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs">
                            <span class="text-zinc-300 font-medium" x-text="item.categoria"></span>
                            <span class="text-zinc-400" x-text="formatearMoneda(item.monto) + ' (' + item.porcentaje + '%)'"></span>
                        </div>
                        <div class="w-full bg-zinc-950 h-2.5 rounded-full overflow-hidden border border-zinc-800">
                            <div class="bg-rose-500 h-full rounded-full transition-all duration-500" :style="'width: ' + item.porcentaje + '%'"></div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- PESTAÑA: CONTROL DE CUOTAS -->
        <div x-show="pestanaActiva === 'cuotas'" class="space-y-3" style="display: none;">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Financiaciones y Cuotas</h2>
                <button @click="abrirModalCuota = true" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-xl font-medium transition">+ Nueva Cuota</button>
            </div>

            <template x-if="cuotas.length === 0">
                <div class="text-center py-12 bg-zinc-900/40 rounded-2xl border border-dashed border-zinc-800">
                    <p class="text-zinc-400 text-sm mb-1">No hay cuotas pendientes</p>
                    <p class="text-zinc-600 text-xs">Controla tus compras en cuotas aquí.</p>
                </div>
            </template>

            <div class="space-y-2.5">
                <template x-for="c in cuotas" :key="c.id">
                    <div class="bg-zinc-900/80 border border-zinc-800/80 p-3.5 rounded-2xl space-y-2 shadow-sm">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-sm font-semibold text-zinc-100" x-text="c.concepto"></p>
                                <p class="text-xs text-zinc-400 mt-0.5">Cuota mensual: <span class="text-zinc-200 font-medium" x-text="formatearMoneda(c.valorCuota)"></span></p>
                            </div>
                            <button @click="eliminarCuota(c.id)" class="text-zinc-600 hover:text-rose-400 text-xs p-1">✕</button>
                        </div>
                        <div class="flex justify-between items-center text-xs pt-2 border-t border-zinc-800/60">
                            <span class="text-zinc-400">Progreso: Cuota <strong class="text-zinc-200" x-text="c.cuotaActual"></strong> de <strong class="text-zinc-200" x-text="c.totalCuotas"></strong> (<span x-text="formatearMoneda(c.valorCuota * (c.totalCuotas - c.cuotaActual + 1))"></span> pendiente)</span>
                            <button @click="avanzarCuota(c.id)" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-2.5 py-1 rounded-lg text-[10px] font-medium transition">Avanzar Mes (+1)</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

    </main>

    <!-- Botón Flotante para Añadir -->
    <div class="fixed bottom-6 right-6 z-20" x-show="pestanaActiva !== 'cuotas'">
        <button @click="abrirModalTransaccion = true" class="bg-zinc-100 hover:bg-white text-zinc-950 w-14 h-14 rounded-full flex items-center justify-center shadow-lg font-bold text-2xl transition transform active:scale-95">
            +
        </button>
    </div>

    <!-- MODAL: NUEVA TRANSACCIÓN -->
    <div x-show="abrirModalTransaccion" class="fixed inset-0 z-30 bg-black/85 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" style="display: none;">
        <div @click.away="abrirModalTransaccion = false" class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="font-bold text-sm text-zinc-200">Nuevo Movimiento</h3>
                <button @click="abrirModalTransaccion = false" class="text-zinc-400 hover:text-zinc-100 text-base">✕</button>
            </div>

            <form @submit.prevent="guardarTransaccion" class="space-y-3.5">
                <div class="grid grid-cols-2 gap-2 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
                    <button type="button" @click="formT.tipo = 'gasto'; actualizarCategorias()" class="py-2 rounded-lg text-xs font-semibold transition" :class="formT.tipo === 'gasto' ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-400'">Gasto</button>
                    <button type="button" @click="formT.tipo = 'ingreso'; actualizarCategorias()" class="py-2 rounded-lg text-xs font-semibold transition" :class="formT.tipo === 'ingreso' ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-400'">Ingreso</button>
                </div>

                <div>
                    <label class="block text-[11px] text-zinc-400 mb-1">Monto ($)</label>
                    <input type="number" step="any" x-model.number="formT.monto" placeholder="0.00" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-zinc-100 focus:outline-none focus:border-zinc-600 text-base font-semibold">
                </div>

                <div>
                    <label class="block text-[11px] text-zinc-400 mb-1">Concepto o Descripción</label>
                    <input type="text" x-model="formT.concepto" placeholder="Ej. Nafta, Supermercado, Uber Moto..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-zinc-100 focus:outline-none focus:border-zinc-600 text-xs">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Categoría</label>
                        <select x-model="formT.categoria" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2.5 py-2 text-zinc-100 focus:outline-none focus:border-zinc-600 text-xs">
                            <template x-for="cat in categoriasDisponibles">
                                <option :value="cat" x-text="cat"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Cuenta de Origen</label>
                        <select x-model="formT.cuenta" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2.5 py-2 text-zinc-100 focus:outline-none focus:border-zinc-600 text-xs">
                            <template x-for="cta in listaNombresCuentas" :key="cta">
                                <option :value="cta" x-text="cta"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-zinc-100 hover:bg-white text-zinc-950 font-semibold py-2.5 rounded-xl transition text-xs mt-1">Guardar</button>
            </form>
        </div>
    </div>

    <!-- MODAL: NUEVA CUOTA -->
    <div x-show="abrirModalCuota" class="fixed inset-0 z-30 bg-black/85 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" style="display: none;">
        <div @click.away="abrirModalCuota = false" class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="font-bold text-sm text-zinc-200">Añadir Compra en Cuotas</h3>
                <button @click="abrirModalCuota = false" class="text-zinc-400 hover:text-zinc-100 text-base">✕</button>
            </div>

            <form @submit.prevent="guardarCuota" class="space-y-3.5">
                <div>
                    <label class="block text-[11px] text-zinc-400 mb-1">Concepto / Producto</label>
                    <input type="text" x-model="formC.concepto" placeholder="Ej. Casco, repuesto moto..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-zinc-100 focus:outline-none focus:border-zinc-600 text-xs">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Valor Cuota ($)</label>
                        <input type="number" step="any" x-model.number="formC.valorCuota" placeholder="0.00" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-zinc-100 focus:outline-none focus:border-zinc-600 text-xs font-semibold">
                    </div>
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Total Cuotas</label>
                        <input type="number" x-model.number="formC.totalCuotas" placeholder="Ej. 3, 6, 12" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-zinc-100 focus:outline-none focus:border-zinc-600 text-xs">
                    </div>
                </div>
                <button type="submit" class="w-full bg-zinc-100 hover:bg-white text-zinc-950 font-semibold py-2.5 rounded-xl transition text-xs mt-1">Guardar Cuota</button>
            </form>
        </div>
    </div>

    <!-- Lógica Pro type Monify -->
    <script>
        function finanzasApp() {
            return {
                pestanaActiva: 'movimientos',
                abrirModalTransaccion: false,
                abrirModalCuota: false,
                filtroBusqueda: '',
                filtroMes: 'todos',
                
                transacciones: JSON.parse(localStorage.getItem('monify_transacciones')) || [],
                cuotas: JSON.parse(localStorage.getItem('monify_cuotas')) || [],
                
                formT: { tipo: 'gasto', monto: '', concepto: '', categoria: 'Combustible / Moto', cuenta: 'Billetera Virtual' },
                formC: { concepto: '', valorCuota: '', totalCuotas: 3, cuotaActual: 1 },

                catsGasto: ['Combustible / Moto', 'Comida / Supermercado', 'Salidas / Ocio', 'Servicios / Cuentas', 'Mantenimiento Moto', 'Gastos Varios'],
                catsIngreso: ['Uber / Moto Trabajo', 'Trabajos Extra', 'Otros Ingresos'],

                listaNombresCuentas: ['Efectivo', 'Billetera Virtual', 'Ingresos Moto / Trabajo', 'Tarjeta de Crédito'],

                get categoriasDisponibles() {
                    return this.formT.tipo === 'gasto' ? this.catsGasto : this.catsIngreso;
                },

                get mesActual() {
                    const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                    const fecha = new Date();
                    return `${meses[fecha.getMonth()]} ${fecha.getFullYear()}`;
                },

                get mesesDisponibles() {
                    const setMeses = new Set();
                    this.transacciones.forEach(t => {
                        if (t.mesAnio) setMeses.add(t.mesAnio);
                    });
                    return Array.from(setMeses);
                },

                get transaccionesFiltradas() {
                    return this.transacciones.filter(t => {
                        const coincideBusqueda = t.concepto.toLowerCase().includes(this.filtroBusqueda.toLowerCase()) || 
                                               t.categoria.toLowerCase().includes(this.filtroBusqueda.toLowerCase());
                        const coincideMes = this.filtroMes === 'todos' || t.mesAnio === this.filtroMes;
                        return coincideBusqueda && coincideMes;
                    });
                },

                get totalIngresos() {
                    return this.transaccionesFiltradas.filter(t => t.tipo === 'ingreso').reduce((acc, t) => acc + t.monto, 0);
                },

                get totalGastos() {
                    return this.transaccionesFiltradas.filter(t => t.tipo === 'gasto').reduce((acc, t) => acc + t.monto, 0);
                },

                get balanceNeto() {
                    return this.totalIngresos - this.totalGastos;
                },

                get cuentasListado() {
                    // Cálculo automático del saldo de cada cuenta basándose en histórico completo
                    const saldos = {
                        'Efectivo': 0,
                        'Billetera Virtual': 0,
                        'Ingresos Moto / Trabajo': 0,
                        'Tarjeta de Crédito': 0
                    };

                    this.transacciones.forEach(t => {
                        if (saldos[t.cuenta] !== undefined) {
                            if (t.tipo === 'ingreso') {
                                saldos[t.cuenta] += t.monto;
                            } else {
                                saldos[t.cuenta] -= t.monto;
                            }
                        }
                    });

                    return [
                        { nombre: 'Billetera Virtual', icono: '📱', descripcion: 'Dinero en app de cobros y pagos', saldo: saldos['Billetera Virtual'] },
                        { nombre: 'Ingresos Moto / Trabajo', icono: '🛵', descripcion: 'Fondo operativo diario', saldo: saldos['Ingresos Moto / Trabajo'] },
                        { nombre: 'Efectivo', icono: '💵', descripcion: 'Billetes físicos en cartera', saldo: saldos['Efectivo'] },
                        { nombre: 'Tarjeta de Crédito', icono: '💳', descripcion: 'Consumos acumulados', saldo: saldos['Tarjeta de Crédito'] }
                    ];
                },

                get gastosPorCategoria() {
                    const total = this.totalGastos;
                    if (total === 0) return [];
                    
                    const agrupados = {};
                    this.transaccionesFiltradas.filter(t => t.tipo === 'gasto').forEach(t => {
                        agrupados[t.categoria] = (agrupados[t.categoria] || 0) + t.monto;
                    });

                    return Object.keys(agrupados).map(cat => {
                        const monto = agrupados[cat];
                        const porcentaje = Math.round((monto / total) * 100);
                        return { categoria: cat, monto, porcentaje };
                    }).sort((a, b) => b.monto - a.monto);
                },

                actualizarCategorias() {
                    this.formT.categoria = this.categoriasDisponibles[0];
                },

                guardarTransaccion() {
                    if (!this.formT.monto || !this.formT.concepto) return;
                    
                    const d = new Date();
                    const mesesNombres = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                    const mesAnioStr = `${mesesNombres[d.getMonth()]} ${d.getFullYear()}`;

                    const nueva = {
                        id: Date.now(),
                        tipo: this.formT.tipo,
                        monto: Number(this.formT.monto),
                        concepto: this.formT.concepto,
                        categoria: this.formT.categoria,
                        cuenta: this.formT.cuenta,
                        fechaFormateada: d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' }),
                        mesAnio: mesAnioStr
                    };

                    this.transacciones.unshift(nueva);
                    this.sincronizarStorage();
                    this.formT.monto = '';
                    this.formT.concepto = '';
                    this.abrirModalTransaccion = false;
                },

                eliminarTransaccion(id) {
                    if (confirm('¿Eliminar este movimiento?')) {
                        this.transacciones = this.transacciones.filter(t => t.id !== id);
                        this.sincronizarStorage();
                    }
                },

                guardarCuota() {
                    if (!this.formC.concepto || !this.formC.valorCuota) return;
                    const nueva = {
                        id: Date.now(),
                        concepto: this.formC.concepto,
                        valorCuota: Number(this.formC.valorCuota),
                        totalCuotas: Number(this.formC.totalCuotas),
                        cuotaActual: 1
                    };
                    this.cuotas.unshift(nueva);
                    this.sincronizarStorageCuotas();
                    this.formC.concepto = '';
                    this.formC.valorCuota = '';
                    this.abrirModalCuota = true; // se cierra con el botón de abajo o cruz
                    this.abrirModalCuota = false;
                },

                avanzarCuota(id) {
                    this.cuotas = this.cuotas.map(c => {
                        if (c.id === id) {
                            if (c.cuotaActual < c.totalCuotas) {
                                c.cuotaActual++;
                            } else {
                                alert('¡Esta cuota ya ha finalizado por completo!');
                            }
                        }
                        return c;
                    });
                    this.sincronizarStorageCuotas();
                },

                eliminarCuota(id) {
                    if (confirm('¿Eliminar esta financiación?')) {
                        this.cuotas = this.cuotas.filter(c => c.id !== id);
                        this.sincronizarStorageCuotas();
                    }
                },

                exportarDatos() {
                    const datos = { transacciones: this.transacciones, cuotas: this.cuotas };
                    const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'respaldo_finanzas.json';
                    a.click();
                },

                sincronizarStorage() {
                    localStorage.setItem('monify_transacciones', JSON.stringify(this.transacciones));
                },

                sincronizarStorageCuotas() {
                    localStorage.setItem('monify_cuotas', JSON.stringify(this.cuotas));
                },

                formatearMoneda(valor) {
                    return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(valor);
                }
            }
        }
    </script>
</body>
</html>
