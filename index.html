<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Financiero Personal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --primary-dark: #4338ca;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.04), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 100px;
        }

        header {
            background: linear-gradient(135deg, #312e81, #4f46e5);
            color: white;
            padding: 24px 20px;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header-top h1 {
            font-size: 1.35rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .balance-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px;
            border-radius: var(--radius);
            text-align: center;
        }

        .balance-card p {
            font-size: 0.8rem;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .balance-card h2 {
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-item span {
            font-size: 0.72rem;
            display: block;
            opacity: 0.85;
            margin-bottom: 2px;
        }

        .stat-item strong {
            font-size: 1rem;
            font-weight: 600;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 24px 0 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        /* Accounts Grid */
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .account-chip {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .account-chip:active {
            transform: scale(0.98);
        }

        .account-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .account-info-flex {
            display: flex;
            align-items: center;
            gap: 8px;
        }
